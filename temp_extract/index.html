    <!-- Libraries (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #050505;
        font-family: 'Assistant', sans-serif;
        color: white;
      }
      .font-serif-luxury { font-family: 'Playfair Display', serif; }
      .font-romantic { font-family: 'Dancing Script', cursive; }
      
      @keyframes smoke {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        20% { opacity: 0.3; }
        100% { transform: translateY(-100vh) scale(3); opacity: 0; }
      }
      .smoke-particle {
        position: absolute;
        bottom: -50px;
        background: radial-gradient(circle, rgba(255,50,50,0.1) 0%, rgba(0,0,0,0) 70%);
        border-radius: 50%;
        pointer-events: none;
      }
      
      /* Hide React until Babel finishes */
      [v-cloak] { display: none; }
    </style>
